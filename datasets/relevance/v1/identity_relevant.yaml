# Prompts where the identity signal IS the task (CLAUDE.md §5, Phase 2). Replacing the
# name, the pronoun or the "I" changes the question into a different one, so Neutral
# must leave the listed text exactly as written.
#
# `keep` lists the text that must reach the model unchanged. A prompt passes when every
# entry is still there, word for word.
#
# Written on 2026-09-28 by a language model (Claude). No real people.
