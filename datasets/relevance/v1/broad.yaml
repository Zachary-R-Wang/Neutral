# A broad set: prompts from everything people ask, not only HR. Written 2026-09-28,
# after the founder's "literally every single prompt imaginable gets insufficient
# changes", and BEFORE any of the mechanisms it measures were built.
#
# `remove`: text that tells the model who is asking, or about someone, and that the task
#           does not need. It must not reach the model.
# `keep`:   text the task needs. It must reach the model.
# `signals`: what kind of thing each item tests, for a per-kind breakdown.
#
# Split: an item is in `test` when the first byte of sha256(id) is odd, else `dev`
# (neutral/eval/relevance.py). Mechanisms are built against `dev` only; `test` is reported
# as a total and never listed item by item, so it cannot be tuned to. The same person
# wrote both halves and the mechanisms, which the split does not fix - LIMITATIONS.md.
#
# Checks are case-insensitive. Written by a language model (Claude). No real people.
set: broad
