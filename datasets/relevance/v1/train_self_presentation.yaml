# Training examples for a learned self-presentation detector (2026-09-28).
#
# Each is a clause someone might write while asking for a verdict on their work, idea or
# claim. label 1: it tells the model about the person asking - how they feel, what they
# invested, what they think the verdict is, why they should be believed, what others said,
# which one is theirs. label 0: it is part of the task - what the thing is, who it is for,
# what to do, constraints, facts to be judged.
#
# Written from scratch, not from any test set: none of these sentences appears in
# everyday.yaml, broad.yaml or identity_relevant.yaml. Written by a language model
# (Claude); the same author wrote the rules it will be compared with.
