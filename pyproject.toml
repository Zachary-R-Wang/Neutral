[project]
name = "neutral"
version = "0.1.0"
description = "Middleware that removes irrelevant identity signal from prompts, and the harness that measures whether doing so changes model outcomes."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neutral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Invariant tests are marked so they can be REPORTED separately.
# They are never skipped and never xfailed - see CLAUDE.md section 9.
markers = [
    "invariant: a safety invariant from CLAUDE.md section 3",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
