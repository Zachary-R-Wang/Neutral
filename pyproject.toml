[project]
name = "neutral"
version = "0.1.0"
description = "Middleware that removes irrelevant identity signal from prompts, and the harness that measures whether doing so changes model outcomes."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.20",
    "spacy>=3.8.16",
    # Declared here rather than installed with `spacy download`. Anything uv does not
    # know about is pruned on the next sync, and losing this model does not fail
    # loudly - detection drops back to rules and quietly gets worse.
    #
    # The medium model rather than the small one, on measurement rather than taste. The
    # small one missed enough names that on five of the seventy evaluation pairs it
    # replaced one variant's name and not the other's - inventing a difference between
    # two prompts that were supposed to end up identical, which is worse than doing
    # nothing. The medium one gets that down to one. The large one is 560MB for a single
    # pair more, and is worse on pronouns. See RESULTS.md.
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The language model is pinned to a wheel URL, which hatch treats as a direct
# reference and refuses unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/neutral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Invariant tests are marked so they can be REPORTED separately.
# They are never skipped and never xfailed - see CLAUDE.md section 9.
markers = [
    "invariant: a safety invariant from CLAUDE.md section 3",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
