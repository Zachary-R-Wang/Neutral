[project]
name = "neutral"
version = "0.1.0"
description = "Middleware that removes irrelevant identity signal from prompts, and the harness that measures whether doing so changes model outcomes."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.20",
    "spacy>=3.8.16",
    # Declared here rather than installed with `spacy download`. Anything uv does not
    # know about is pruned on the next sync, and losing this model does not fail
    # loudly - detection drops back to rules and quietly gets worse.
    #
    # The large model, chosen on measurement rather than on size. Four detectors were
    # compared on the seventy evaluation pairs, on seventy short matched sentence frames,
    # and on eight sentences full of capitalised things that are not people:
    #
    #                pairs identical   invents a difference   recall   false positives
    #   rules only        46/70                 0              100%         7 of 8
    #   small             40/70                 5              100%         1 of 8
    #   medium            43/70                 1               84%         0 of 8
    #   large             44/70                 1              100%         0 of 8
    #
    # Rules only wins the first column and is unusable: it replaces "Human Resources",
    # "Salesforce" and "London" with a person's placeholder. That column alone cannot
    # decide this, because over-detection applies to both halves of a matched pair and
    # cancels out of the very metric it should fail.
    #
    # It costs 385MB of memory against 142MB, which is why the server VM is 1GB.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The language model is pinned to a wheel URL, which hatch treats as a direct
# reference and refuses unless this is set.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/neutral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Invariant tests are marked so they can be REPORTED separately.
# They are never skipped and never xfailed - see CLAUDE.md section 9.
markers = [
    "invariant: a safety invariant from CLAUDE.md section 3",
]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
